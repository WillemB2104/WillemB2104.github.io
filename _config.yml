# ─────────────────────────────────────────────────────────────────────────────
# SITE SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
locale                   : "en-GB"
title                    : "Willem B. Bruin"
title_separator          : "|"
subtitle                 : "Precision psychiatry & neuroimaging"
name                     : &name "Willem B. Bruin, PhD"
description              : &description >-
  Postdoctoral researcher at Amsterdam UMC and Leiden University. Normative
  modelling of brain development, biomarkers for psychiatry, and large-scale
  neuroimaging.
url                      : "https://willemb2104.github.io"
baseurl                  : ""
repository               : "WillemB2104/WillemB2104.github.io"
teaser                   : # /assets/images/teaser.jpg
logo                     : # /assets/images/logo.png
masthead_title           : "Willem B. Bruin"
breadcrumbs              : false
words_per_minute         : 200

# Theme: must be remote_theme on GitHub Pages, not `theme`
remote_theme             : "mmistakes/minimal-mistakes@4.28.1"

# Skin options: "default", "air", "aqua", "contrast", "dark", "dirt",
# "neon", "mint", "plum", "sunrise"
minimal_mistakes_skin    : "dark"

# Site-wide search
search                   : true
search_full_content      : true
search_provider          : lunr
lunr:
  search_within_pages    : true

# ─────────────────────────────────────────────────────────────────────────────
# SEO / SOCIAL SHARING
# ─────────────────────────────────────────────────────────────────────────────
og_image                 : "/assets/images/og-card.png"
social:
  type                   : Person
  name                   : *name
  links:
    - "https://orcid.org/0000-0002-0672-8903"
    - "https://scholar.google.nl/citations?user=TUq1H20AAAAJ&hl=en"
    - "https://www.linkedin.com/in/willem-bruin-b2a2b6ba/"
    - "https://github.com/WillemB2104"

# Add these once you have them (Search Console / Analytics)
google_site_verification: "-izHuYPfOYermR-pb5W1Nq5QMgkEEhiMFUUGB3ey3NM"
analytics:
  provider               : false

# ─────────────────────────────────────────────────────────────────────────────
# AUTHOR: this drives the sidebar that appears on every page
# ─────────────────────────────────────────────────────────────────────────────
author:
  name             : *name
  avatar           : "/assets/images/profile.jpg"
  bio              : >-
    Postdoctoral researcher in precision psychiatry. Brain development,
    OCD, and biomarkers for treatment response.
  location         : "Amsterdam & Leiden, NL"
  email            : "w.b.bruin@amsterdamumc.nl"
  orcid_id         : "0000-0002-0672-8903"
  links:
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-0672-8903"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.nl/citations?user=TUq1H20AAAAJ&hl=en"
    - label: "Amsterdam UMC"
      icon: "fas fa-fw fa-university"
      url: "https://pure.amsterdamumc.nl/en/persons/willem-bruin/"
    - label: "Leiden University"
      icon: "fas fa-fw fa-university"
      url: "https://www.universiteitleiden.nl/en/staffmembers/willem-bruin"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/WillemB2104"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/willem-bruin-b2a2b6ba/"

# ─────────────────────────────────────────────────────────────────────────────
# FOOTER
# ─────────────────────────────────────────────────────────────────────────────
footer:
  links:
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-0672-8903"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.nl/citations?user=TUq1H20AAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/WillemB2104"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/willem-bruin-b2a2b6ba/"

# ─────────────────────────────────────────────────────────────────────────────
# BUILD SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

include:
  - _pages
  - .htaccess

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - tmp
  - vendor

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTTING
# ─────────────────────────────────────────────────────────────────────────────
permalink: /:categories/:title/
timezone: Europe/Amsterdam

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ─────────────────────────────────────────────────────────────────────────────
# DEFAULTS: what every page and post inherits unless overridden
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
