<script>
/* Normative trajectory field.
   Percentile bands with individual trajectories drawn across them, one of
   which departs from the expected range. Teal is expected, amber is deviation.
   Only runs on the splash landing page. */
(function () {
  var hero = document.querySelector(".page__hero--overlay");
  if (!hero || !document.body.classList.contains("layout--splash")) return;

  var reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var canvas = document.createElement("canvas");
  canvas.id = "trajectory-field";
  canvas.setAttribute("aria-hidden", "true");
  hero.insertBefore(canvas, hero.firstChild);

  var ctx = canvas.getContext("2d");
  if (!ctx) return;

  var EXPECTED = [63, 208, 201];
  var DEVIATION = [240, 168, 72];
  var W = 0, H = 0, lines = [], raf = null, startTs = null, visible = true;

  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
  function mean(t) { return 0.62 * (1 - Math.exp(-3.4 * t)) - 0.16 * t * t; }
  function spread(t) { return 0.05 + 0.17 * Math.pow(t, 0.9); }
  function px(t) { return t * W; }
  function py(v) { return H - (0.09 * H + v * H * 0.66); }

  function seed(n) {
    lines = [];
    for (var i = 0; i < n; i++) {
      var dev = (i === n - 1);
      lines.push({
        dev: dev,
        z: dev ? 0.05 : (Math.random() * 2 - 1),
        drift: dev ? 1.25 : (Math.random() * 0.4 - 0.2),
        wob: 0.006 + Math.random() * 0.012,
        phase: Math.random() * Math.PI * 2,
        freq: 2 + Math.random() * 3,
        delay: dev ? 0.10 : Math.random() * 0.3
      });
    }
  }

  function yOf(t, ln) {
    return mean(t) + (ln.z + ln.drift * Math.pow(t, 2.6)) * spread(t)
      + Math.sin(t * ln.freq * Math.PI + ln.phase) * ln.wob;
  }

  function band(zLo, zHi, alpha) {
    var i, t;
    ctx.beginPath();
    for (i = 0; i <= 90; i++) {
      t = i / 90;
      var v = mean(t) + zHi * spread(t);
      if (i === 0) ctx.moveTo(px(t), py(v)); else ctx.lineTo(px(t), py(v));
    }
    for (i = 90; i >= 0; i--) {
      t = i / 90;
      ctx.lineTo(px(t), py(mean(t) + zLo * spread(t)));
    }
    ctx.closePath();
    ctx.fillStyle = rgba(EXPECTED, alpha);
    ctx.fill();
  }

  function draw(progress) {
    ctx.clearRect(0, 0, W, H);
    band(-1.96, 1.96, 0.05);
    band(-0.67, 0.67, 0.06);

    ctx.beginPath();
    for (var i = 0; i <= 90; i++) {
      var t = i / 90;
      if (i === 0) ctx.moveTo(px(t), py(mean(t))); else ctx.lineTo(px(t), py(mean(t)));
    }
    ctx.strokeStyle = rgba(EXPECTED, 0.33);
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    for (var k = 0; k < lines.length; k++) {
      var ln = lines[k];
      var p = (progress - ln.delay) / (1 - ln.delay);
      if (p <= 0) continue;
      if (p > 1) p = 1;

      ctx.beginPath();
      var first = true;
      for (var j = 0; j <= 90; j++) {
        var tt = j / 90;
        if (tt > p) break;
        var yy = py(yOf(tt, ln));
        if (first) { ctx.moveTo(px(tt), yy); first = false; } else { ctx.lineTo(px(tt), yy); }
      }
      ctx.strokeStyle = rgba(ln.dev ? DEVIATION : EXPECTED, ln.dev ? 0.94 : 0.30);
      ctx.lineWidth = ln.dev ? 1.8 : 1;
      ctx.stroke();

      var ex = px(p), ey = py(yOf(p, ln));
      ctx.beginPath();
      ctx.arc(ex, ey, ln.dev ? 3.2 : 1.6, 0, Math.PI * 2);
      ctx.fillStyle = rgba(ln.dev ? DEVIATION : EXPECTED, ln.dev ? 1 : 0.5);
      ctx.fill();
    }
  }

  function frame(ts) {
    if (startTs === null) startTs = ts;
    var elapsed = (ts - startTs) / 1000;
    var p = elapsed / 8;
    draw(p > 1 ? 1 : p);
    if (elapsed > 15) startTs = ts;
    raf = window.requestAnimationFrame(frame);
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = hero.clientWidth;
    H = hero.clientHeight;
    if (!W || !H) return;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw(1);
  }

  function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = null; } }
  function play() { if (!raf && !reduce) { startTs = null; raf = window.requestAnimationFrame(frame); } }

  seed(9);
  resize();
  window.addEventListener("resize", function () { resize(); });

  if (reduce) {
    draw(1);
  } else {
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        if (visible) play(); else stop();
      }, { threshold: 0 }).observe(hero);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop(); else if (visible) play();
    });
    play();
  }
})();
</script>
