<script>
/* Normative trajectory field.
   Percentile bands with individual trajectories, and measurement points
   travelling along them through developmental time. Teal is within the
   expected range; a point turns amber when its trajectory leaves the band.
   Rendered twice: large in the splash hero, and as a faint strip behind the
   masthead so every page carries it. */
(function () {
  var reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var EXPECTED = [63, 208, 201];
  var DEVIATION = [240, 168, 72];

  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
  function mean(t) { return 0.62 * (1 - Math.exp(-3.4 * t)) - 0.16 * t * t; }
  function spread(t) { return 0.05 + 0.17 * Math.pow(t, 0.9); }

  function createField(host, o) {
    if (!host) return;

    var canvas = document.createElement("canvas");
    canvas.className = "trajectory-field";
    canvas.setAttribute("aria-hidden", "true");
    var s = canvas.style;
    s.position = "absolute"; s.top = "0"; s.left = "0"; s.right = "0"; s.bottom = "0";
    s.width = "100%"; s.height = "100%";
    s.zIndex = "0"; s.display = "block"; s.pointerEvents = "none";
    if (o.opacity) s.opacity = String(o.opacity);

    var cs = window.getComputedStyle(host);
    if (cs.position === "static") host.style.position = "relative";
    host.style.overflow = "hidden";
    host.insertBefore(canvas, host.firstChild);

    if (o.lift) {
      var kids = host.querySelectorAll(o.lift);
      for (var q = 0; q < kids.length; q++) {
        kids[q].style.position = "relative";
        kids[q].style.zIndex = "2";
      }
    }

    var ctx = canvas.getContext("2d");
    if (!ctx) return;

    var W = 0, H = 0, lines = [], points = [], raf = null, last = null, onscreen = true;

    function px(t) { return t * W; }
    function py(v) { return H - (o.base * H + v * H * o.scale); }
    function zOf(t, ln) { return ln.z + ln.drift * Math.pow(t, 2.6); }
    function yOf(t, ln) {
      return mean(t) + zOf(t, ln) * spread(t)
        + Math.sin(t * ln.freq * Math.PI + ln.phase) * ln.wob;
    }

    function seed(n) {
      lines = []; points = [];
      for (var i = 0; i < n; i++) {
        var dev = (i === n - 1);
        var ln = {
          dev: dev,
          z: dev ? 0.05 : (Math.random() * 2 - 1),
          drift: dev ? 2.3 : (Math.random() * 0.4 - 0.2),
          wob: 0.006 + Math.random() * 0.012,
          phase: Math.random() * Math.PI * 2,
          freq: 2 + Math.random() * 3
        };
        lines.push(ln);
        for (var m = 0; m < o.dotsPerLine; m++) {
          points.push({ line: ln, t: (i * 0.11 + m / o.dotsPerLine) % 1,
                        speed: 0.045 + Math.random() * 0.02 });
        }
      }
    }

    function band(zLo, zHi, alpha) {
      var i, t;
      ctx.beginPath();
      for (i = 0; i <= 90; i++) {
        t = i / 90;
        var v = mean(t) + zHi * spread(t);
        if (i === 0) ctx.moveTo(px(t), py(v)); else ctx.lineTo(px(t), py(v));
      }
      for (i = 90; i >= 0; i--) {
        t = i / 90;
        ctx.lineTo(px(t), py(mean(t) + zLo * spread(t)));
      }
      ctx.closePath();
      ctx.fillStyle = rgba(EXPECTED, alpha);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      band(-1.96, 1.96, o.bandAlpha);
      band(-0.67, 0.67, o.bandAlpha * 1.2);

      if (o.median) {
        ctx.beginPath();
        for (var i = 0; i <= 90; i++) {
          var t = i / 90;
          if (i === 0) ctx.moveTo(px(t), py(mean(t))); else ctx.lineTo(px(t), py(mean(t)));
        }
        ctx.strokeStyle = rgba(EXPECTED, 0.32);
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      for (var k = 0; k < lines.length; k++) {
        var ln = lines[k];
        ctx.beginPath();
        for (var j = 0; j <= 90; j++) {
          var tt = j / 90, yy = py(yOf(tt, ln));
          if (j === 0) ctx.moveTo(px(tt), yy); else ctx.lineTo(px(tt), yy);
        }
        ctx.strokeStyle = rgba(ln.dev ? DEVIATION : EXPECTED,
          ln.dev ? o.lineAlpha * 2 : o.lineAlpha);
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      for (var q = 0; q < points.length; q++) {
        var p = points[q];
        var outside = Math.abs(zOf(p.t, p.line)) > 1.96;
        var col = outside ? DEVIATION : EXPECTED;
        var x = px(p.t), y = py(yOf(p.t, p.line));
        var edge = Math.min(1, Math.min(p.t, 1 - p.t) / 0.06);
        var r = o.dot * (outside ? 1.4 : 1);

        ctx.beginPath();
        ctx.arc(x, y, r * 2.8, 0, Math.PI * 2);
        ctx.fillStyle = rgba(col, 0.12 * edge);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = rgba(col, (outside ? 1 : 0.78) * edge);
        ctx.fill();
      }
    }

    function frame(ts) {
      if (last === null) last = ts;
      var dt = Math.min((ts - last) / 1000, 0.05);
      last = ts;
      for (var q = 0; q < points.length; q++) {
        points[q].t += points[q].speed * dt;
        if (points[q].t > 1) points[q].t -= 1;
      }
      draw();
      raf = window.requestAnimationFrame(frame);
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = host.clientWidth; H = host.clientHeight;
      if (!W || !H) return;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = null; } }
    function play() { if (!raf && !reduce) { last = null; raf = window.requestAnimationFrame(frame); } }

    seed(o.lines);
    resize();

    var rt;
    window.addEventListener("resize", function () {
      clearTimeout(rt); rt = setTimeout(resize, 120);
    });

    if (reduce) { draw(); return; }
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (e) {
        onscreen = e[0].isIntersecting;
        if (onscreen) play(); else stop();
      }, { threshold: 0 }).observe(host);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop(); else if (onscreen) play();
    });
    play();
  }

  // Splash hero: the full statement
  if (document.body.classList.contains("layout--splash")) {
    createField(document.querySelector(".page__hero--overlay"), {
      lines: 9, dotsPerLine: 2, dot: 2.4, base: 0.09, scale: 0.66,
      bandAlpha: 0.05, lineAlpha: 0.18, median: true, lift: ".wrapper"
    });
  }

  // Masthead: a faint version, so every page carries the motif
  createField(document.querySelector(".masthead"), {
    lines: 6, dotsPerLine: 1, dot: 1.8, base: 0.12, scale: 0.85,
    bandAlpha: 0.035, lineAlpha: 0.14, median: false, opacity: 0.85,
    lift: ".masthead__inner-wrap"
  });
})();
</script>

<script>
/* ---------------------------------------------------------------------------
   Wubdog.
   Type "wubdog" into site search (or anywhere on the page) and the screen
   rains dogs. Harmless, pointer-events: none, and it respects
   prefers-reduced-motion. Search itself keeps working throughout.
--------------------------------------------------------------------------- */
(function () {
  var WORD = "wubdog";
  var GLYPHS = ["\uD83D\uDC36", "\uD83D\uDC15", "\uD83E\uDDB4", "\uD83D\uDC3E", "\uD83D\uDC29"];
  var running = false;
  var typed = "";

  var reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function styles() {
    if (document.getElementById("wubdog-style")) return;
    var s = document.createElement("style");
    s.id = "wubdog-style";
    s.textContent =
      "#wubdog-layer{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}" +
      "#wubdog-layer span{position:absolute;top:-2em;will-change:transform,opacity;" +
      "animation:wubdog-fall linear forwards}" +
      "@keyframes wubdog-fall{" +
      "0%{transform:translateY(-10vh) rotate(0deg);opacity:0}" +
      "8%{opacity:1}" +
      "90%{opacity:1}" +
      "100%{transform:translateY(110vh) rotate(var(--spin));opacity:0}}" +
      "#wubdog-toast{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%);" +
      "z-index:10000;background:#1c2230;color:#d7dee8;border:1px solid #2b3446;" +
      "border-radius:999px;padding:.55rem 1.1rem;font-size:.9rem;" +
      "font-family:'IBM Plex Sans',sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35);" +
      "opacity:0;transition:opacity .3s ease}" +
      "#wubdog-toast.on{opacity:1}";
    document.head.appendChild(s);
  }

  function toast(msg, ms) {
    var t = document.getElementById("wubdog-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "wubdog-toast";
      t.setAttribute("role", "status");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(function () { t.classList.add("on"); });
    setTimeout(function () {
      t.classList.remove("on");
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
    }, ms || 3200);
  }

  function rain() {
    if (running) return;
    running = true;
    styles();
    toast("\uD83D\uDC36 Wubdog mode activated");

    if (reduce) { running = false; return; }

    var layer = document.createElement("div");
    layer.id = "wubdog-layer";
    layer.setAttribute("aria-hidden", "true");
    document.body.appendChild(layer);

    var COUNT = window.innerWidth < 600 ? 34 : 64;
    for (var i = 0; i < COUNT; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement("span");
          el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          el.style.left = (Math.random() * 98) + "vw";
          el.style.fontSize = (1.1 + Math.random() * 2.1) + "rem";
          el.style.animationDuration = (4.2 + Math.random() * 3.6) + "s";
          el.style.setProperty("--spin", (Math.random() * 900 - 450) + "deg");
          layer.appendChild(el);
        }, i * 70);
      })(i);
    }

    setTimeout(function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
      running = false;
    }, 11000);
  }

  function clean(v) {
    return (v || "").toLowerCase().replace(/[^a-z]/g, "");
  }

  // 1. The site search box
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "INPUT") return;
    var isSearch = t.type === "search" ||
      (t.className && String(t.className).indexOf("search-input") !== -1) ||
      t.id === "search";
    if (isSearch && clean(t.value) === WORD) rain();
  }, true);

  // 2. Or just type it anywhere outside a text field
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!/^[a-zA-Z]$/.test(e.key)) return;
    typed = (typed + e.key.toLowerCase()).slice(-WORD.length);
    if (typed === WORD) { typed = ""; rain(); }
  });
})();
</script>
